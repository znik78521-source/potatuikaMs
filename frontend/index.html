<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a0b2e">
    <title>Potatuika Messenger</title>
    <style>
        :root {
            --primary: #b77bff;
            --secondary: #00ffaa;
            --bg-dark: #1a0b2e;
            --bg-light: #2a1a3e;
            --bg-card: rgba(26, 11, 46, 0.95);
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border: rgba(183, 123, 255, 0.2);
            --ios-safe-bottom: env(safe-area-inset-bottom);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-light));
            color: var(--text);
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        .page { display: none; width: 100%; height: 100%; }
        .page.active { display: block; }

        /* AUTH */
        .auth-container {
            max-width: 400px; width: 90%; margin: 10vh auto; background: var(--bg-card);
            border-radius: 28px; padding: 32px; border: 1px solid var(--border); backdrop-filter: blur(20px);
        }
        .logo { text-align: center; margin-bottom: 24px; font-size: 40px; }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border-radius: 20px; border: none; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #000; font-weight: bold; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-form input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: #fff; }
        .auth-form button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-weight: bold; }

        /* APP LAYOUT */
        .app-container { display: flex; height: 100vh; width: 100%; position: relative; }

        .sidebar {
            width: 350px; background: var(--bg-card); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; transition: transform 0.3s ease;
        }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); }

        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; z-index: 5; }
            .chat-area { width: 100%; position: absolute; z-index: 10; transform: translateX(100%); transition: transform 0.3s ease; }
            .chat-area.active-mobile { transform: translateX(0); }
        }

        /* UI ELEMENTS */
        .user-info { padding: 20px; background: rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .chat-item.active { background: var(--hover); border-left: 3px solid var(--secondary); }

        .chat-header { padding: 15px; background: var(--bg-card); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .back-btn { display: none; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        @media (max-width: 768px) { .back-btn { display: block; } }

        .messages-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
        .message.own { align-self: flex-end; background: var(--secondary); color: #000; border-bottom-right-radius: 4px; }
        .message.other { align-self: flex-start; background: rgba(255,255,255,0.1); border-bottom-left-radius: 4px; }

        .message-input-area { 
            padding: 12px; background: var(--bg-card); display: flex; gap: 10px; 
            padding-bottom: calc(12px + var(--ios-safe-bottom));
        }
        .message-input-area input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: #fff; }
        .message-input-area button { width: 45px; height: 45px; border-radius: 50%; border: none; background: var(--primary); color: #fff; cursor: pointer; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-light); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

<div id="login-page" class="page active"></div>
<div id="app-page" class="page">
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="user-info" id="user-info">
                <div class="avatar" id="user-avatar">👤</div>
                <div class="user-details">
                    <h3 id="user-displayname">Загрузка...</h3>
                    <p id="user-username">@username</p>
                </div>
            </div>
            <div class="search-box" style="padding: 10px;">
                <input type="text" id="search-input" placeholder="🔍 Поиск..." style="width:100%; padding:10px; border-radius:20px; border:none; background:rgba(255,255,255,0.1); color:#fff;">
            </div>
            <div class="chats-list" id="chats-list"></div>
        </div>

        <div class="chat-area" id="chat-area">
            <div class="chat-header">
                <button class="back-btn" id="back-btn">←</button>
                <div class="chat-header-info">
                    <h2 id="chat-title">Выберите чат</h2>
                    <div class="chat-status-text" id="chat-status-text" style="font-size: 12px; color: var(--text-secondary);"></div>
                </div>
            </div>
            <div class="messages-container" id="messages-container"></div>
            <div class="message-input-area" id="input-area" style="display: none;">
                <input type="text" id="message-input" placeholder="Сообщение...">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>
</div>

<!-- Модалки -->
<div id="profile-modal" class="modal">
    <div class="modal-content">
        <h3>Профиль</h3>
        <input type="text" id="profile-displayname" placeholder="Имя" style="width:100%; margin: 10px 0; padding:10px;">
        <button id="save-profile" style="width:100%; padding:10px; background:var(--secondary); border:none; border-radius:10px; cursor:pointer;">💾 Сохранить</button>
        <button onclick="closeModal('profile-modal')" style="width:100%; margin-top:10px; background:none; color:#fff; border:none; cursor:pointer;">Закрыть</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    let socket = null, currentUser = null, currentChat = null;
    let token = localStorage.getItem('potatuika_token');

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // Авторизация
    function showLoginForm() {
        const loginPage = document.getElementById('login-page');
        loginPage.innerHTML = `
            <div class="auth-container">
                <div class="logo">💜💚</div>
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
                    <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
                </div>
                <div id="login-form" class="auth-form active">
                    <input type="text" id="l-user" placeholder="Логин">
                    <input type="password" id="l-pass" placeholder="Пароль">
                    <button onclick="auth('login')">Войти</button>
                </div>
                <div id="register-form" class="auth-form">
                    <input type="text" id="r-user" placeholder="Придумайте логин">
                    <input type="text" id="r-name" placeholder="Ваше имя">
                    <input type="password" id="r-pass" placeholder="Пароль">
                    <button onclick="auth('register')">Создать аккаунт</button>
                </div>
            </div>
        `;
    }

    window.switchTab = (type) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(type === 'login' ? 'вход' : 'рег')));
        document.getElementById('login-form').classList.toggle('active', type === 'login');
        document.getElementById('register-form').classList.toggle('active', type === 'register');
    }

    async function auth(type) {
        const u = document.getElementById(type === 'login' ? 'l-user' : 'r-user').value;
        const p = document.getElementById(type === 'login' ? 'l-pass' : 'r-pass').value;
        const n = type === 'register' ? document.getElementById('r-name').value : null;

        const res = await fetch('/api/' + type, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p, displayName: n})
        });

        if(res.ok) {
            const data = await res.json();
            localStorage.setItem('potatuika_token', data.token);
            token = data.token;
            location.reload();
        } else {
            alert('Ошибка авторизации');
        }
    }

    function connectSocket() {
        socket = io({ auth: { token } });

        socket.on('init', (data) => {
            currentUser = data.user;
            document.getElementById('user-displayname').textContent = currentUser.displayName;
            document.getElementById('user-username').textContent = '@' + currentUser.username;
            document.getElementById('login-page').classList.remove('active');
            document.getElementById('app-page').classList.add('active');
            renderChats(data.chats || []);
        });

        socket.on('new_message', (msg) => {
            if (currentChat && (msg.to === currentChat.id || (msg.type === 'dm' && msg.from === currentChat.id.split('_').find(n => n !== currentUser.username)))) {
                addMessageToChat(msg);
            }
            socket.emit('get_chats');
        });

        socket.on('chat_history', (data) => {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            data.messages.forEach(addMessageToChat);
            container.scrollTop = container.scrollHeight;
        });

        socket.on('refresh_chats', renderChats);
    }

    function renderChats(chats) {
        const list = document.getElementById('chats-list');
        list.innerHTML = '';
        chats.forEach(chat => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            const name = chat.type === 'dm' ? '@' + chat.with : chat.name;
            div.innerHTML = `<div class="avatar">👤</div><div><b>${name}</b><br><small>${chat.lastMessage?.text || 'Нет сообщений'}</small></div>`;
            div.onclick = () => selectChat(chat, name);
            list.appendChild(div);
        });
    }

    function selectChat(chat, name) {
        currentChat = chat;
        document.getElementById('chat-title').textContent = name;
        document.getElementById('input-area').style.display = 'flex';
        document.getElementById('chat-area').classList.add('active-mobile');
        socket.emit('load_chat', { chatId: chat.id });
    }

    function addMessageToChat(msg) {
        const container = document.getElementById('messages-container');
        const isOwn = msg.from === currentUser.username;
        const div = document.createElement('div');
        div.className = `message ${isOwn ? 'own' : 'other'}`;
        div.textContent = msg.text;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    document.getElementById('send-btn').onclick = () => {
        const input = document.getElementById('message-input');
        if(!input.value.trim() || !currentChat) return;
        socket.emit('send_message', {
            to: currentChat.id,
            type: currentChat.type,
            text: input.value
        });
        input.value = '';
    };

    document.getElementById('back-btn').onclick = () => {
        document.getElementById('chat-area').classList.remove('active-mobile');
    };

    document.getElementById('user-info').onclick = () => {
        document.getElementById('profile-displayname').value = currentUser.displayName;
        openModal('profile-modal');
    };

    if (token) connectSocket(); else showLoginForm();
</script>
</body>
</html>
